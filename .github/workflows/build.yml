name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android --project-name lucky_kamai
      - name: Allow internet and set app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          sed -i 's|android:label="lucky_kamai"|android:label="Lucky Kamai"|' $M
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Sign APK with fixed key
        env:
          KS_B64: ${{ secrets.ANDROID_KS_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "No key set, skipping"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias luckykamai --out "$RUNNER_TEMP/signed.apk" "$APK"
          mv "$RUNNER_TEMP/signed.apk" "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: lucky-kamai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lucky Kamai (latest)
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
